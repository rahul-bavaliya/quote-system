[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-system"
version = "0.1.0"
description = "Labour + parts quoting from historical work orders"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3",
  "polars>=1.0",
  "pyarrow>=15",
  "fastexcel>=0.11",
  "pandas>=2.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1"]

[project.scripts]
qs-pipeline = "quote_system.pipeline:main"
qs-backtest = "quote_system.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quote_system = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with:UserWarning"]
