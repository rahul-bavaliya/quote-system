[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-system"
version = "0.1.0"
description = "Labour + parts quoting from historical work orders"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3",
  "polars>=1.0",
  "pyarrow>=15",
  "fastexcel>=0.11",
  "pandas>=2.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.5",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1", "ruff>=0.6"]

[project.scripts]
qs-pipeline = "quote_system.pipeline:main"
qs-backtest = "quote_system.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quote_system = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with:UserWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S608",  # SQL is built from our own config/constants, values go through parameters
  "S101",  # asserts in tests
  "B008",  # FastAPI Depends/Query in defaults
  "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/quote_system/sample_data.py" = ["S311"]
"src/quote_system/backtest.py" = ["S311"]
